# Hermes agent-plugin manifest.
#
# The web dashboard discovers this plugin via dashboard/manifest.json; this
# file exists so the panel's "Install from GitHub" pins the install folder
# name (`x-dashboard`) regardless of the GitHub repository name.
name: x-dashboard
label: X Dashboard
description: Zero-cost & auto-linked X analytics dashboard for Hermes Desktop and Web.
version: 0.1.0
author: Omar (@omx0r)
manifest_version: 1
requires_env:
  - X_DASHBOARD_HANDLE
  - X_BEARER_TOKEN
  - XAI_API_KEY
config_schema:
  handle:
    type: string
    default: ""
    description: "Default X handle to monitor (e.g. NousResearch)"
  default_mode:
    type: string
    choices: ["auto", "free", "live_v2"]
    default: "auto"
    description: "Default data source mode (auto, free $0.00 public intelligence, or live_v2 X API v2)"
  enable_x_search:
    type: boolean
    default: false
    description: "Opt-in to use Hermes's paid xAI x_search tool for additional post and mention discovery"
  x_bearer_token:
    type: string
    secret: true
    env: X_BEARER_TOKEN
    description: "Optional X API v2 Bearer token for on-demand Live API v2 mode"
